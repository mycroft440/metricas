name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Testes do núcleo (:core)
        run: ./gradlew --stacktrace :core:test

      - name: Compilar APK (debug e release)
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Publicar APKs
        uses: actions/upload-artifact@v5
        with:
          name: tempo-de-tela-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Relatório dos testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: core/build/reports/tests/
          if-no-files-found: ignore
